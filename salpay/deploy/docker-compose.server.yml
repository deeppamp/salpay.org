services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.server
    environment:
      PORT: ${BACKEND_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      # Chain / treasury view live on the VPS host (systemd salpay-treasury-view).
      SALVIUM_RPC_URL: ${SALVIUM_RPC_URL:-http://host.docker.internal:29089/json_rpc}
      TREASURY_VIEW_RPC_URL: ${TREASURY_VIEW_RPC_URL:-http://host.docker.internal:29089/json_rpc}
      TREASURY_PUBLIC_STATS: ${TREASURY_PUBLIC_STATS:-true}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-https://sal.cash}
      TURNSTILE_ENFORCE: ${TURNSTILE_ENFORCE:-true}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      RATE_LIMIT_SEND_PER_MINUTE: ${RATE_LIMIT_SEND_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_MINUTE: ${RATE_LIMIT_REGISTER_PER_MINUTE:-10}
      RATE_LIMIT_SUGGEST_PER_MINUTE: ${RATE_LIMIT_SUGGEST_PER_MINUTE:-120}
    expose:
      - "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
