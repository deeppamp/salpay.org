{{define "login"}}
{{template "header" .}}
<h1>log in</h1>
<form method="post" action="/login">
<p><label>username<br><input name="username" value="{{.Username}}" required></label></p>
<p><label>password<br><input name="password" type="password" required></label></p>
{{if .NeedCode}}<p><label>2fa code or recovery code<br><input name="code" autocomplete="one-time-code" autofocus required></label></p>{{end}}
<p><button>log in</button></p>
</form>
<p class="muted">no account? <a href="/signup">sign up</a></p>
<p class="muted">lost password? <a href="/recover">recover with a code</a></p>
{{template "footer" .}}
{{end}}
